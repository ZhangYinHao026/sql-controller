server:
  port: 8083
spring:
  datasource:
    url: jdbc:mysql://${SQL_CONFIG_DB_HOST:192.168.0.227}:3306/${SQL_CONFIG_DB_NAME:sql-controller}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${SQL_CONFIG_DB_USER:root}
    password: ${SQL_CONFIG_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true
sql-controller:
  encryption-key: ${SQL_ENCRYPTION_KEY:change-this-local-key-32-bytes}
  execution-timeout-seconds: 300    # 查询类(及未分类)SQL 超时：SELECT/SHOW/DESC/WITH（2026-09-10 由 30 放宽到 300，与 DML 一致；注意元数据查询 executeRaw/count 也走此值）
  dml-timeout-seconds: 300          # 写类(DML)超时：INSERT/UPDATE/DELETE/MERGE
  ddl-timeout-seconds: 600          # 结构类(DDL)超时：CREATE/ALTER/DROP/TRUNCATE/RENAME（大表加列可达分钟级）
  connection-test-timeout-seconds: 10
  max-page-size: 100
  default-page-size: 10
  cors-origins: "*"
  # 表浏览写入口：默认全关——本工具没有登录鉴权，默认不允许「点单元格就改库」。
  # 需要改数据/改结构时显式置 true 并重启；关闭时后端直接拒绝 /api/db/rows/* 与 /api/db/ddl/execute。
  write:
    enabled: ${SQL_CONTROLLER_WRITE_ENABLED:false}
    online-enabled: ${SQL_CONTROLLER_WRITE_ONLINE_ENABLED:false}
  # SQL 编辑器联想数据源配置
  autocomplete:
    enabled: true
    schema-source: 8          # 11.auto 自动取 `database_connection` 表第一条记录   2.固定 connectionId
    schema-cache-seconds: 86400    # 结构元数据缓存 TTL：24h（联想 + 字段对比快照共用，可「强制重抓」绕过）
    max-tables: 500               # 表数量上限
    max-columns: 100               # 单表字段上限
    # 表浏览「单表结构」缓存：读路径命中即返回，写路径（改数据/改结构）永远真查，不受此配置影响。
    #   -1 = 永不过期（默认）：查一次管到重启，靠右键「刷新表结构 / 重拉整库结构」手动失效
    #    0 = 关闭缓存：每次真查（回到旧行为，出问题可一键回退）
    #   >0 = 到期自动重查（秒）
    table-cache-seconds: -1
    table-cache-max-entries: 2000  # 缓存条数上限（全局），超出按写入顺序淘汰最旧
  # 线上环境：查询经内网「远程查询小助手」只读代理，修改经各省 sxwh-allowance 的 updateSql 接口。
  # 说明：小助手地址全局固定，区域差异只体现在 area 参数（每个区域各配一条 online_connection 记录）。
  online:
    base-url: ${SQL_ONLINE_BASE_URL:http://192.168.0.2:808}
    page-config-ttl-seconds: 3600   # 区域清单 pageConfig.json 缓存
    connect-timeout-seconds: 10
    read-timeout-seconds: 120       # 跨省网络慢，读超时留足
    max-concurrency: 8              # 多区域并行上限
    default-page-size: 10
    max-page-size: 500
    write:
      # 加密串生成方式：remote=先调中心加密接口再写（默认，推荐）；local=本地 sm4-key 自己算；auto=远程失败回落本地
      encrypt-mode: ${SQL_ONLINE_ENCRYPT_MODE:remote}
      # 中心加密接口：POST 明文（JSON 字符串字面量，含权限后缀）→ 返回 hex 加密串
      # 注意：text/plain 会 415，必须 application/json
      encrypt-url: ${SQL_ONLINE_ENCRYPT_URL:http://111.56.142.13:18080/api/sxwh/updateSqlSm}
      encrypt-timeout-seconds: 30
      # SM4 密钥只在 local / auto 回落时用到；remote 模式可留空
      sm4-key: ${SQL_ONLINE_SM4_KEY:}
      permission-suffix: ${SQL_ONLINE_PERMISSION_SUFFIX:sxwhkj@2024}
      # 写入路径：/api/sxwh/updateSql 无需登录态（实测可用）；/api/apply/updateSql 需要登录 token
      path: ${SQL_ONLINE_WRITE_PATH:/api/sxwh/updateSql}
      # 超时分档（2026-10-24）：DML/未分类 60s；DDL（大表 ALTER 可达分钟级，别让前端先断）单独放宽
      timeout-seconds: 60
      ddl-timeout-seconds: ${SQL_ONLINE_DDL_TIMEOUT:600}
      allow-delete: true              # 内部开发工具：DELETE/DROP 等由前端二次确认把关
      # 说明：DDL（CREATE/ALTER/DROP/TRUNCATE/RENAME）始终允许——字段对比「本地结构同步到线上」要用
